<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel — Motor de citas</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --gris-fondo: #f5f6f8;
    --gris-borde: #e2e4e8;
    --texto: #1f2430;
    --texto-suave: #6b7280;
    --azul: #2563eb;
    --verde: #16a34a;
    --rojo: #dc2626;
    --amarillo: #ca8a04;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--gris-fondo);
    color: var(--texto);
  }
  header {
    background: white;
    border-bottom: 1px solid var(--gris-borde);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
  }
  header h1 { font-size: 18px; margin: 0; margin-right: auto; }
  select, button, input {
    font-size: 14px;
    padding: 8px 12px;
    border-radius: 6px;
    border: 1px solid var(--gris-borde);
    background: white;
  }
  button { cursor: pointer; background: var(--azul); color: white; border: none; }
  button:hover { opacity: 0.9; }
  button.secundario { background: white; color: var(--texto); border: 1px solid var(--gris-borde); }
  main { padding: 24px; max-width: 1100px; margin: 0 auto; }
  nav.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  nav.tabs button { background: white; color: var(--texto); border: 1px solid var(--gris-borde); }
  nav.tabs button.activa { background: var(--azul); color: white; border-color: var(--azul); }
  section.panel {
    background: white;
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    padding: 16px;
  }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--gris-borde); }
  th { color: var(--texto-suave); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  tr:last-child td { border-bottom: none; }
  .estado { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .estado-pendiente { background: #fef3c7; color: var(--amarillo); }
  .estado-confirmada { background: #dcfce7; color: var(--verde); }
  .estado-cancelada { background: #fee2e2; color: var(--rojo); }
  .estado-completada { background: #e0e7ff; color: #4338ca; }
  .estado-no_asistio { background: #f3f4f6; color: var(--texto-suave); }
  .vacio, .cargando, .error { padding: 32px 8px; text-align: center; color: var(--texto-suave); }
  .error { color: var(--rojo); }

  #pantallaLogin {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #pantallaLogin form {
    background: white;
    border: 1px solid var(--gris-borde);
    border-radius: 10px;
    padding: 32px;
    width: 320px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  #pantallaLogin h1 { font-size: 18px; margin: 0 0 8px; }
  #pantallaLogin .errorLogin { color: var(--rojo); font-size: 13px; min-height: 18px; }

  .grid-calendario {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .encabezado-dia {
    text-align: center;
    font-size: 12px;
    font-weight: 600;
    color: var(--texto-suave);
    text-transform: uppercase;
    padding-bottom: 4px;
  }
  .dia-calendario, .dia-vacio {
    border-radius: 8px;
    padding: 8px 6px;
    min-height: 56px;
  }
  .dia-vacio { background: transparent; }
  .dia-calendario { border: 1px solid var(--gris-borde); }
  .dia-calendario .numero-dia { font-weight: 600; font-size: 13px; }
  .dia-calendario .etiqueta-dia { font-size: 11px; margin-top: 4px; }
  .dia-abierto { background: #f0fdf4; }
  .dia-abierto .etiqueta-dia { color: var(--verde); }
  .dia-cerrado-manual { background: #fef2f2; cursor: pointer; }
  .dia-cerrado-manual .etiqueta-dia { color: var(--rojo); }
  .dia-abierto[data-fecha] { cursor: pointer; }
  .dia-cerrado-defecto { background: #f9fafb; color: var(--texto-suave); }
  .dia-cerrado-defecto .etiqueta-dia { color: var(--texto-suave); }

  .dia-horario { padding: 10px 0; border-bottom: 1px solid var(--gris-borde); }
  .dia-horario-titulo { font-weight: 600; margin-bottom: 6px; }
  .bloques-dia { display: flex; flex-direction: column; gap: 6px; margin-bottom: 6px; }
  .fila-bloque { display: flex; align-items: center; gap: 8px; }
  .boton-agregar-bloque, .boton-quitar-bloque { font-size: 12px; padding: 4px 10px; }
</style>
</head>
<body>

<div id="pantallaLogin">
  <form id="formLogin">
    <h1>Panel — Motor de citas</h1>
    <input type="email" id="campoCorreo" placeholder="correo@ejemplo.com" required />
    <input type="password" id="campoContrasena" placeholder="contraseña" required />
    <button type="submit">Entrar</button>
    <div class="errorLogin" id="errorLogin"></div>
  </form>
</div>

<div id="pantallaPanel" style="display: none;">
  <header>
    <h1>Panel — Motor de citas</h1>
    <select id="selectorNegocio"></select>
    <button id="botonRefrescar">Refrescar</button>
    <button id="botonSalir" class="secundario">Cerrar sesión</button>
  </header>

  <main>
    <nav class="tabs">
      <button data-vista="citas" class="activa">Citas</button>
      <button data-vista="clientes">Clientes</button>
      <button data-vista="recursos">Recursos</button>
      <button data-vista="servicios">Servicios</button>
      <button data-vista="horarios">Horarios</button>
      <button data-vista="calendario">Calendario</button>
    </nav>

    <section class="panel">
      <div id="contenido" class="cargando">Cargando...</div>
    </section>
  </main>
</div>

<script>
  // ---------------------------------------------------------------------
  // Rellena esto con los datos de TU proyecto de Supabase.
  // La llave "anon" / "publishable" está hecha para vivir en código público
  // como este — a diferencia de la service_role key, esta SÍ es segura de
  // exponer, porque todo lo que puede hacer está limitado por las políticas
  // de RLS (rls-panel-auth.sql), no por mantenerla en secreto.
  // ---------------------------------------------------------------------
  const SUPABASE_URL = 'https://hpkupabarylrqihateed.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_NapnUGy_NJ061jKYtWRYuw_x-_vR-Yp';

  const { createClient } = supabase;
  const cliente = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const pantallaLogin = document.getElementById('pantallaLogin');
  const pantallaPanel = document.getElementById('pantallaPanel');
  const formLogin = document.getElementById('formLogin');
  const errorLogin = document.getElementById('errorLogin');

  let negocioActual = null;
  let vistaActual = 'citas';
  let recursoSeleccionado = null;
  let mesCalendario = null; // Date al primer día del mes que se está mostrando
  const DIAS_SEMANA = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];

  formLogin.addEventListener('submit', async (evento) => {
    evento.preventDefault();
    errorLogin.textContent = '';
    const correo = document.getElementById('campoCorreo').value;
    const contrasena = document.getElementById('campoContrasena').value;

    const { error } = await cliente.auth.signInWithPassword({ email: correo, password: contrasena });
    if (error) {
      errorLogin.textContent = 'No se pudo entrar: ' + error.message;
    }
    // Si funciona, onAuthStateChange más abajo se encarga de mostrar el panel.
  });

  document.getElementById('botonSalir').addEventListener('click', async () => {
    await cliente.auth.signOut();
  });

  cliente.auth.onAuthStateChange((_evento, sesion) => {
    if (sesion) {
      pantallaLogin.style.display = 'none';
      pantallaPanel.style.display = '';
      iniciarPanel();
    } else {
      pantallaPanel.style.display = 'none';
      pantallaLogin.style.display = 'flex';
    }
  });

  // --- A partir de aquí, todo requiere sesión iniciada ---

  const selectorNegocio = document.getElementById('selectorNegocio');
  const contenido = document.getElementById('contenido');
  const botones = document.querySelectorAll('nav.tabs button');
  let listenersListos = false;

  function activarListeners() {
    if (listenersListos) return;
    listenersListos = true;

    botones.forEach((boton) => {
      boton.addEventListener('click', () => {
        vistaActual = boton.dataset.vista;
        botones.forEach((b) => b.classList.toggle('activa', b === boton));
        cargarVista();
      });
    });

    document.getElementById('botonRefrescar').addEventListener('click', cargarVista);
    selectorNegocio.addEventListener('change', () => {
      negocioActual = selectorNegocio.value;
      cargarVista();
    });
  }

  function formatearFecha(iso) {
    if (!iso) return '';
    return new Date(iso).toLocaleString('es-MX', { dateStyle: 'medium', timeStyle: 'short' });
  }

  function badgeEstado(estado) {
    return `<span class="estado estado-${estado}">${estado}</span>`;
  }

  function tabla(columnas, filas, celda) {
    if (filas.length === 0) return '<div class="vacio">No hay nada que mostrar todavía.</div>';
    const encabezado = columnas.map((c) => `<th>${c}</th>`).join('');
    const cuerpo = filas.map((fila) => `<tr>${celda(fila)}</tr>`).join('');
    return `<table><thead><tr>${encabezado}</tr></thead><tbody>${cuerpo}</tbody></table>`;
  }

  async function cargarNegocios() {
    const { data, error } = await cliente.from('negocios').select('*').order('nombre');
    if (error) throw error;
    selectorNegocio.innerHTML = data.map((n) => `<option value="${n.id}">${n.nombre}</option>`).join('');
    if (data.length > 0) negocioActual = data[0].id;
  }

  async function iniciarPanel() {
    activarListeners();
    try {
      await cargarNegocios();
      await cargarVista();
    } catch (err) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo conectar: ' + err.message;
    }
  }

  async function cargarVista() {
    if (!negocioActual) {
      contenido.className = 'vacio';
      contenido.textContent = 'Todavía no hay ningún negocio registrado.';
      return;
    }

    if (vistaActual === 'horarios') {
      // Vista con su propio manejo de carga/errores (tiene formulario e
      // interacción propia), así que no pasa por el flujo genérico de abajo.
      await cargarVistaHorarios();
      return;
    }
    if (vistaActual === 'calendario') {
      await cargarVistaCalendario();
      return;
    }
    if (vistaActual === 'recursos') {
      await cargarVistaRecursos();
      return;
    }
    if (vistaActual === 'servicios') {
      await cargarVistaServicios();
      return;
    }

    contenido.className = 'cargando';
    contenido.textContent = 'Cargando...';

    try {
      if (vistaActual === 'citas') {
        const { data, error } = await cliente
          .from('citas')
          .select('id, inicio, fin, estado, motivo_cancelacion, recursos(nombre), servicios(nombre, precio), clientes(nombre, telefono)')
          .eq('negocio_id', negocioActual)
          .order('inicio', { ascending: true });
        if (error) throw error;

        contenido.innerHTML = tabla(
          ['Inicio', 'Fin', 'Servicio', 'Recurso', 'Cliente', 'Teléfono', 'Estado'],
          data,
          (c) => `
            <td>${formatearFecha(c.inicio)}</td>
            <td>${formatearFecha(c.fin)}</td>
            <td>${c.servicios?.nombre ?? '—'}</td>
            <td>${c.recursos?.nombre ?? '—'}</td>
            <td>${c.clientes?.nombre ?? '—'}</td>
            <td>${c.clientes?.telefono ?? '—'}</td>
            <td>${badgeEstado(c.estado)}</td>
          `
        );
      } else if (vistaActual === 'clientes') {
        const { data, error } = await cliente
          .from('clientes')
          .select('id, nombre, telefono, consentimiento, creado_en')
          .eq('negocio_id', negocioActual)
          .order('creado_en', { ascending: false });
        if (error) throw error;

        contenido.innerHTML = tabla(
          ['Nombre', 'Teléfono', 'Consentimiento', 'Creado'],
          data,
          (c) => `
            <td>${c.nombre ?? '—'}</td>
            <td>${c.telefono}</td>
            <td>${c.consentimiento ? 'Sí' : 'No'}</td>
            <td>${formatearFecha(c.creado_en)}</td>
          `
        );
      }
    } catch (err) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + err.message;
    }
  }

  // --- Horarios y días de atención (lectura + escritura) ---

  async function cargarVistaHorarios() {
    contenido.className = 'cargando';
    contenido.textContent = 'Cargando...';

    const { data: recursos, error: errRecursos } = await cliente
      .from('recursos')
      .select('id, nombre')
      .eq('negocio_id', negocioActual)
      .order('nombre');
    if (errRecursos) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + errRecursos.message;
      return;
    }
    if (recursos.length === 0) {
      contenido.className = 'vacio';
      contenido.textContent = 'Este negocio no tiene recursos todavía.';
      return;
    }

    if (!recursoSeleccionado || !recursos.some((r) => r.id === recursoSeleccionado)) {
      recursoSeleccionado = recursos[0].id;
    }

    const { data: horarios, error: errHorarios } = await cliente
      .from('horarios_laborales')
      .select('*')
      .eq('recurso_id', recursoSeleccionado);
    if (errHorarios) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + errHorarios.message;
      return;
    }

    // dia_semana -> lista de bloques {inicio, fin}, ordenados. Un día sin
    // bloques está cerrado ese día — ya no hay un checkbox aparte, la
    // presencia o ausencia de bloques ES la señal.
    const porDia = {};
    horarios.forEach((h) => {
      if (!porDia[h.dia_semana]) porDia[h.dia_semana] = [];
      porDia[h.dia_semana].push({ inicio: h.hora_inicio.slice(0, 5), fin: h.hora_fin.slice(0, 5) });
    });
    Object.values(porDia).forEach((lista) => lista.sort((a, b) => a.inicio.localeCompare(b.inicio)));

    function filaBloqueHtml(inicio, fin) {
      return `
        <div class="fila-bloque">
          <input type="time" class="hora-inicio" value="${inicio}" />
          <span>a</span>
          <input type="time" class="hora-fin" value="${fin}" />
          <button type="button" class="secundario boton-quitar-bloque">Quitar</button>
        </div>
      `;
    }

    contenido.className = '';
    contenido.innerHTML = `
      <div style="margin-bottom:16px;">
        <label>Recurso: </label>
        <select id="selectorRecursoHorarios">
          ${recursos.map((r) => `<option value="${r.id}" ${r.id === recursoSeleccionado ? 'selected' : ''}>${r.nombre}</option>`).join('')}
        </select>
      </div>
      <div style="font-size:12px; color:var(--texto-suave); margin-bottom:12px;">
        Un día sin ningún bloque queda cerrado. Puedes agregar más de un
        bloque por día para horario partido (ej. 9:00-13:00 y 16:00-20:00).
      </div>
      <div id="diasHorarios">
        ${DIAS_SEMANA.map((nombreDia, i) => `
          <div class="dia-horario" data-dia="${i}">
            <div class="dia-horario-titulo">${nombreDia}</div>
            <div class="bloques-dia">
              ${(porDia[i] || []).map((b) => filaBloqueHtml(b.inicio, b.fin)).join('')}
            </div>
            <button type="button" class="secundario boton-agregar-bloque">+ Agregar bloque</button>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:16px; display:flex; align-items:center; gap:12px;">
        <button id="botonGuardarHorarios">Guardar horarios</button>
        <span id="mensajeHorarios" style="font-size:13px;"></span>
      </div>
    `;

    document.getElementById('selectorRecursoHorarios').addEventListener('change', (e) => {
      recursoSeleccionado = e.target.value;
      cargarVistaHorarios();
    });

    document.querySelectorAll('.boton-agregar-bloque').forEach((boton) => {
      boton.addEventListener('click', () => {
        const contenedorBloques = boton.previousElementSibling; // .bloques-dia
        contenedorBloques.insertAdjacentHTML('beforeend', filaBloqueHtml('09:00', '18:00'));
        activarBotonesQuitarBloque();
      });
    });
    activarBotonesQuitarBloque();

    document.getElementById('botonGuardarHorarios').addEventListener('click', guardarHorarios);
  }

  function activarBotonesQuitarBloque() {
    // Usa .onclick (no addEventListener) para poder llamarse varias veces
    // sin ir acumulando listeners duplicados en los botones que ya tenían.
    document.querySelectorAll('.boton-quitar-bloque').forEach((boton) => {
      boton.onclick = () => boton.closest('.fila-bloque').remove();
    });
  }

  async function guardarHorarios() {
    const mensaje = document.getElementById('mensajeHorarios');
    mensaje.textContent = 'Guardando...';
    mensaje.style.color = 'var(--texto-suave)';

    const contenedoresDias = document.querySelectorAll('.dia-horario');
    const nuevos = [];

    for (const contenedorDia of contenedoresDias) {
      const dia = Number(contenedorDia.dataset.dia);
      const bloquesDelDia = [];

      for (const fila of contenedorDia.querySelectorAll('.fila-bloque')) {
        const horaInicio = fila.querySelector('.hora-inicio').value;
        const horaFin = fila.querySelector('.hora-fin').value;

        if (!horaInicio || !horaFin) {
          mensaje.textContent = `Falta una hora en ${DIAS_SEMANA[dia]}.`;
          mensaje.style.color = 'var(--rojo)';
          return;
        }
        if (horaFin <= horaInicio) {
          mensaje.textContent = `En ${DIAS_SEMANA[dia]}, cada bloque debe cerrar después de abrir.`;
          mensaje.style.color = 'var(--rojo)';
          return;
        }
        bloquesDelDia.push({ horaInicio, horaFin });
      }

      bloquesDelDia.sort((a, b) => a.horaInicio.localeCompare(b.horaInicio));
      for (let i = 1; i < bloquesDelDia.length; i++) {
        if (bloquesDelDia[i].horaInicio < bloquesDelDia[i - 1].horaFin) {
          mensaje.textContent = `En ${DIAS_SEMANA[dia]}, hay bloques que se traslapan entre sí.`;
          mensaje.style.color = 'var(--rojo)';
          return;
        }
      }

      bloquesDelDia.forEach((b) => {
        nuevos.push({ recurso_id: recursoSeleccionado, dia_semana: dia, hora_inicio: b.horaInicio, hora_fin: b.horaFin });
      });
    }

    // Reemplaza todo el horario del recurso: borra lo que había y mete lo
    // nuevo. Es más simple y menos propenso a errores que tratar de calcular
    // qué cambió bloque por bloque.
    const { error: errBorrar } = await cliente
      .from('horarios_laborales')
      .delete()
      .eq('recurso_id', recursoSeleccionado);
    if (errBorrar) {
      mensaje.textContent = 'No se pudo guardar: ' + errBorrar.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    if (nuevos.length > 0) {
      const { error: errInsertar } = await cliente.from('horarios_laborales').insert(nuevos);
      if (errInsertar) {
        mensaje.textContent = 'No se pudo guardar (tus horarios anteriores ya se borraron, vuelve a intentar): ' + errInsertar.message;
        mensaje.style.color = 'var(--rojo)';
        return;
      }
    }

    mensaje.textContent = 'Guardado.';
    mensaje.style.color = 'var(--verde)';
  }

  // --- Calendario mensual de excepciones (días cerrados puntuales) ---
  //
  // El patrón semanal (pestaña Horarios) sigue siendo la regla general.
  // Esta vista solo marca EXCEPCIONES de cierre sobre días que, por el
  // patrón semanal, normalmente estarían abiertos — usando la tabla
  // "bloqueos", que el motor (disponibilidad.js) ya respeta desde el
  // principio. No abre días que el patrón semanal no contempla.

  async function cargarVistaCalendario() {
    contenido.className = 'cargando';
    contenido.textContent = 'Cargando...';

    const { data: recursos, error: errRecursos } = await cliente
      .from('recursos')
      .select('id, nombre')
      .eq('negocio_id', negocioActual)
      .order('nombre');
    if (errRecursos) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + errRecursos.message;
      return;
    }
    if (recursos.length === 0) {
      contenido.className = 'vacio';
      contenido.textContent = 'Este negocio no tiene recursos todavía.';
      return;
    }

    if (!recursoSeleccionado || !recursos.some((r) => r.id === recursoSeleccionado)) {
      recursoSeleccionado = recursos[0].id;
    }
    if (!mesCalendario) {
      const hoy = new Date();
      mesCalendario = new Date(hoy.getFullYear(), hoy.getMonth(), 1);
    }

    const { data: horariosLaborales, error: errHorarios } = await cliente
      .from('horarios_laborales')
      .select('dia_semana')
      .eq('recurso_id', recursoSeleccionado);
    if (errHorarios) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + errHorarios.message;
      return;
    }
    const diasAbiertosPorDefecto = new Set(horariosLaborales.map((h) => h.dia_semana));

    const inicioMes = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth(), 1);
    const finMes = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth() + 1, 0);
    const finMesExclusivo = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth() + 1, 1);

    const { data: bloqueos, error: errBloqueos } = await cliente
      .from('bloqueos')
      .select('id, inicio, fin')
      .eq('recurso_id', recursoSeleccionado)
      .lt('inicio', finMesExclusivo.toISOString())
      .gt('fin', inicioMes.toISOString());
    if (errBloqueos) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + errBloqueos.message;
      return;
    }

    const diasEnMes = finMes.getDate();
    const primerDiaSemana = inicioMes.getDay();

    let celdas = '';
    for (let i = 0; i < primerDiaSemana; i++) celdas += '<div class="dia-vacio"></div>';

    for (let dia = 1; dia <= diasEnMes; dia++) {
      const fecha = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth(), dia);
      const diaSemana = fecha.getDay();
      const inicioDia = fecha;
      const finDia = new Date(fecha.getFullYear(), fecha.getMonth(), fecha.getDate() + 1);

      const bloqueoDelDia = bloqueos.find(
        (b) => new Date(b.inicio) < finDia && new Date(b.fin) > inicioDia
      );
      const abiertoPorDefecto = diasAbiertosPorDefecto.has(diaSemana);

      let clase, etiqueta, atributos = '';
      if (bloqueoDelDia) {
        clase = 'dia-cerrado-manual';
        etiqueta = 'Cerrado';
        atributos = `data-fecha="${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}" data-bloqueo-id="${bloqueoDelDia.id}"`;
      } else if (abiertoPorDefecto) {
        clase = 'dia-abierto';
        etiqueta = 'Abierto';
        atributos = `data-fecha="${fecha.getFullYear()}-${String(fecha.getMonth() + 1).padStart(2, '0')}-${String(dia).padStart(2, '0')}"`;
      } else {
        clase = 'dia-cerrado-defecto';
        etiqueta = '—';
      }

      celdas += `
        <div class="dia-calendario ${clase}" ${atributos}>
          <div class="numero-dia">${dia}</div>
          <div class="etiqueta-dia">${etiqueta}</div>
        </div>
      `;
    }

    contenido.className = '';
    contenido.innerHTML = `
      <div style="display:flex; align-items:center; gap:12px; margin-bottom:16px; flex-wrap:wrap;">
        <label>Recurso: </label>
        <select id="selectorRecursoCalendario">
          ${recursos.map((r) => `<option value="${r.id}" ${r.id === recursoSeleccionado ? 'selected' : ''}>${r.nombre}</option>`).join('')}
        </select>
        <button id="botonMesAnterior" class="secundario">← Mes anterior</button>
        <strong style="text-transform:capitalize;">${mesCalendario.toLocaleDateString('es-MX', { month: 'long', year: 'numeric' })}</strong>
        <button id="botonMesSiguiente" class="secundario">Mes siguiente →</button>
      </div>
      <div style="display:flex; gap:16px; margin-bottom:12px; font-size:12px; color:var(--texto-suave);">
        <span>🟢 Abierto según horario semanal (clic para cerrar ese día)</span>
        <span>🔴 Cerrado manualmente (clic para reabrir)</span>
        <span>⚪ Sin horario semanal ese día</span>
      </div>
      <div class="grid-calendario">
        ${['Dom', 'Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb'].map((d) => `<div class="encabezado-dia">${d}</div>`).join('')}
        ${celdas}
      </div>
      <div id="mensajeCalendario" style="margin-top:12px; font-size:13px;"></div>
    `;

    document.getElementById('selectorRecursoCalendario').addEventListener('change', (e) => {
      recursoSeleccionado = e.target.value;
      cargarVistaCalendario();
    });
    document.getElementById('botonMesAnterior').addEventListener('click', () => {
      mesCalendario = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth() - 1, 1);
      cargarVistaCalendario();
    });
    document.getElementById('botonMesSiguiente').addEventListener('click', () => {
      mesCalendario = new Date(mesCalendario.getFullYear(), mesCalendario.getMonth() + 1, 1);
      cargarVistaCalendario();
    });
    document.querySelectorAll('.dia-calendario[data-fecha]').forEach((celda) => {
      celda.addEventListener('click', () => alternarDia(celda.dataset.fecha, celda.dataset.bloqueoId || null));
    });
  }

  // --- Servicios (alta, editar, eliminar) ---
  //
  // Aquí es donde se define cuánto dura cada tipo de cita (duracion_min):
  // el motor (disponibilidad.js) usa ese número para calcular los horarios
  // disponibles. Horarios (la otra pestaña) solo dice qué días/horas
  // atiende cada recurso — cosas distintas a propósito.

  async function cargarVistaServicios() {
    contenido.className = 'cargando';
    contenido.textContent = 'Cargando...';

    const { data: servicios, error } = await cliente
      .from('servicios')
      .select('id, nombre, descripcion, duracion_min, precio, anticipo')
      .eq('negocio_id', negocioActual)
      .order('nombre');
    if (error) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + error.message;
      return;
    }

    contenido.className = '';
    contenido.innerHTML = `
      <div style="display:flex; flex-direction:column; gap:8px; margin-bottom:12px; max-width:640px;">
        <div style="display:flex; gap:8px; flex-wrap:wrap; align-items:center;">
          <input type="text" id="nombreNuevoServicio" placeholder="Nombre del servicio" style="width:180px;" />
          <input type="number" id="duracionNuevoServicio" placeholder="Duración (min)" min="1" style="width:130px;" />
          <input type="number" id="precioNuevoServicio" placeholder="Precio" min="0" step="0.01" style="width:110px;" />
          <input type="number" id="anticipoNuevoServicio" placeholder="Anticipo" min="0" step="0.01" style="width:110px;" />
        </div>
        <input type="text" id="descripcionNuevoServicio" placeholder="Descripción (opcional) — ej. incluye lavado y secado" style="width:100%;" />
        <div><button id="botonAgregarServicio">Agregar servicio</button></div>
      </div>
      <div id="mensajeServicios" style="font-size:13px; margin-bottom:12px;"></div>
      ${servicios.length === 0 ? '<div class="vacio">Todavía no hay servicios.</div>' : `
        <table>
          <thead><tr><th>Nombre</th><th>Descripción</th><th>Duración (min)</th><th>Precio</th><th>Anticipo</th><th></th></tr></thead>
          <tbody>
            ${servicios.map((s) => `
              <tr data-id="${s.id}">
                <td>
                  <span class="texto-nombre">${s.nombre}</span>
                  <input type="text" class="input-nombre" value="${s.nombre}" style="display:none; width:140px;" />
                </td>
                <td>
                  <span class="texto-descripcion">${s.descripcion ?? '—'}</span>
                  <input type="text" class="input-descripcion" value="${s.descripcion ?? ''}" style="display:none; width:200px;" />
                </td>
                <td>
                  <span class="texto-duracion">${s.duracion_min}</span>
                  <input type="number" class="input-duracion" value="${s.duracion_min}" min="1" style="display:none; width:90px;" />
                </td>
                <td>
                  <span class="texto-precio">$${Number(s.precio).toFixed(2)}</span>
                  <input type="number" class="input-precio" value="${s.precio}" min="0" step="0.01" style="display:none; width:90px;" />
                </td>
                <td>
                  <span class="texto-anticipo">$${Number(s.anticipo).toFixed(2)}</span>
                  <input type="number" class="input-anticipo" value="${s.anticipo}" min="0" step="0.01" style="display:none; width:90px;" />
                </td>
                <td style="white-space:nowrap;">
                  <button type="button" class="secundario boton-editar-servicio">Editar</button>
                  <button type="button" class="secundario boton-guardar-servicio" style="display:none;">Guardar</button>
                  <button type="button" class="secundario boton-eliminar-servicio">Eliminar</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;

    document.getElementById('botonAgregarServicio').addEventListener('click', agregarServicio);

    document.querySelectorAll('tr[data-id]').forEach((fila) => {
      const id = fila.dataset.id;
      const campos = ['nombre', 'descripcion', 'duracion', 'precio', 'anticipo'].map((campo) => ({
        campo,
        span: fila.querySelector(`.texto-${campo}`),
        input: fila.querySelector(`.input-${campo}`),
      }));
      const botonEditar = fila.querySelector('.boton-editar-servicio');
      const botonGuardar = fila.querySelector('.boton-guardar-servicio');
      const botonEliminar = fila.querySelector('.boton-eliminar-servicio');

      botonEditar.addEventListener('click', () => {
        campos.forEach(({ span, input }) => {
          span.style.display = 'none';
          input.style.display = '';
        });
        botonEditar.style.display = 'none';
        botonGuardar.style.display = '';
      });

      botonGuardar.addEventListener('click', () => {
        const [nombreEl, descripcionEl, duracionEl, precioEl, anticipoEl] = campos.map((c) => c.input);
        editarServicio(id, {
          nombre: nombreEl.value,
          descripcion: descripcionEl.value,
          duracionMin: duracionEl.value,
          precio: precioEl.value,
          anticipo: anticipoEl.value,
        });
      });

      botonEliminar.addEventListener('click', () => eliminarServicio(id, campos[0].span.textContent));
    });
  }

  async function agregarServicio() {
    const mensaje = document.getElementById('mensajeServicios');
    const nombre = document.getElementById('nombreNuevoServicio').value.trim();
    const descripcion = document.getElementById('descripcionNuevoServicio').value.trim();
    const duracionMin = document.getElementById('duracionNuevoServicio').value;
    const precio = document.getElementById('precioNuevoServicio').value || 0;
    const anticipo = document.getElementById('anticipoNuevoServicio').value || 0;

    if (!nombre) {
      mensaje.textContent = 'Escribe un nombre para el servicio.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    if (!duracionMin || Number(duracionMin) <= 0) {
      mensaje.textContent = 'La duración debe ser un número de minutos mayor a 0.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    if (Number(precio) < 0 || Number(anticipo) < 0) {
      mensaje.textContent = 'El precio y el anticipo no pueden ser negativos.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    mensaje.textContent = 'Guardando...';
    mensaje.style.color = 'var(--texto-suave)';

    const { error } = await cliente.from('servicios').insert({
      negocio_id: negocioActual,
      nombre,
      descripcion: descripcion || null,
      duracion_min: Number(duracionMin),
      precio: Number(precio),
      anticipo: Number(anticipo),
    });
    if (error) {
      mensaje.textContent = 'No se pudo agregar: ' + error.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    await cargarVistaServicios();
  }

  async function editarServicio(id, valores) {
    const mensaje = document.getElementById('mensajeServicios');
    const nombre = valores.nombre.trim();
    const descripcion = valores.descripcion.trim();
    const duracionMin = Number(valores.duracionMin);
    const precio = Number(valores.precio);
    const anticipo = Number(valores.anticipo);

    if (!nombre) {
      mensaje.textContent = 'El nombre no puede quedar vacío.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    if (!duracionMin || duracionMin <= 0) {
      mensaje.textContent = 'La duración debe ser un número de minutos mayor a 0.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    if (precio < 0 || anticipo < 0) {
      mensaje.textContent = 'El precio y el anticipo no pueden ser negativos.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    const { error } = await cliente
      .from('servicios')
      .update({ nombre, descripcion: descripcion || null, duracion_min: duracionMin, precio, anticipo })
      .eq('id', id);
    if (error) {
      mensaje.textContent = 'No se pudo guardar: ' + error.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    await cargarVistaServicios();
  }

  async function eliminarServicio(id, nombre) {
    const mensaje = document.getElementById('mensajeServicios');
    mensaje.textContent = 'Verificando...';
    mensaje.style.color = 'var(--texto-suave)';

    // A diferencia de recursos, servicio_id en "citas" no tiene cascada —
    // Postgres rechazaría el borrado si hay citas. Se revisa antes para dar
    // un mensaje claro en vez de un error crudo de base de datos.
    const { count, error: errConteo } = await cliente
      .from('citas')
      .select('id', { count: 'exact', head: true })
      .eq('servicio_id', id);
    if (errConteo) {
      mensaje.textContent = 'No se pudo verificar: ' + errConteo.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    if (count > 0) {
      mensaje.textContent = `"${nombre}" tiene ${count} cita(s) asociada(s). No se puede eliminar sin perder ese historial — cancela o reasigna esas citas primero.`;
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    if (!confirm(`¿Eliminar el servicio "${nombre}"? Esta acción no se puede deshacer.`)) {
      mensaje.textContent = '';
      return;
    }

    const { error } = await cliente.from('servicios').delete().eq('id', id);
    if (error) {
      mensaje.textContent = 'No se pudo eliminar: ' + error.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    await cargarVistaServicios();
  }

  // --- Recursos (alta, renombrar, eliminar) ---

  async function cargarVistaRecursos() {
    contenido.className = 'cargando';
    contenido.textContent = 'Cargando...';

    const { data: recursos, error } = await cliente
      .from('recursos')
      .select('id, nombre, creado_en')
      .eq('negocio_id', negocioActual)
      .order('nombre');
    if (error) {
      contenido.className = 'error';
      contenido.textContent = 'No se pudo cargar: ' + error.message;
      return;
    }

    contenido.className = '';
    contenido.innerHTML = `
      <div style="display:flex; gap:8px; margin-bottom:12px;">
        <input type="text" id="nombreNuevoRecurso" placeholder="Nombre del nuevo recurso" />
        <button id="botonAgregarRecurso">Agregar recurso</button>
      </div>
      <div id="mensajeRecursos" style="font-size:13px; margin-bottom:12px;"></div>
      ${recursos.length === 0 ? '<div class="vacio">Todavía no hay recursos.</div>' : `
        <table>
          <thead><tr><th>Nombre</th><th>Creado</th><th></th></tr></thead>
          <tbody>
            ${recursos.map((r) => `
              <tr data-id="${r.id}">
                <td>
                  <span class="texto-nombre">${r.nombre}</span>
                  <input type="text" class="input-nombre" value="${r.nombre}" style="display:none;" />
                </td>
                <td>${formatearFecha(r.creado_en)}</td>
                <td style="white-space:nowrap;">
                  <button type="button" class="secundario boton-renombrar">Renombrar</button>
                  <button type="button" class="secundario boton-guardar-nombre" style="display:none;">Guardar</button>
                  <button type="button" class="secundario boton-eliminar-recurso">Eliminar</button>
                </td>
              </tr>
            `).join('')}
          </tbody>
        </table>
      `}
    `;

    document.getElementById('botonAgregarRecurso').addEventListener('click', agregarRecurso);

    document.querySelectorAll('tr[data-id]').forEach((fila) => {
      const id = fila.dataset.id;
      const spanNombre = fila.querySelector('.texto-nombre');
      const inputNombre = fila.querySelector('.input-nombre');
      const botonRenombrar = fila.querySelector('.boton-renombrar');
      const botonGuardar = fila.querySelector('.boton-guardar-nombre');
      const botonEliminar = fila.querySelector('.boton-eliminar-recurso');

      botonRenombrar.addEventListener('click', () => {
        spanNombre.style.display = 'none';
        inputNombre.style.display = '';
        botonRenombrar.style.display = 'none';
        botonGuardar.style.display = '';
        inputNombre.focus();
      });

      botonGuardar.addEventListener('click', () => renombrarRecurso(id, inputNombre.value));
      botonEliminar.addEventListener('click', () => eliminarRecurso(id, spanNombre.textContent));
    });
  }

  async function agregarRecurso() {
    const mensaje = document.getElementById('mensajeRecursos');
    const input = document.getElementById('nombreNuevoRecurso');
    const nombre = input.value.trim();

    if (!nombre) {
      mensaje.textContent = 'Escribe un nombre para el recurso.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    mensaje.textContent = 'Guardando...';
    mensaje.style.color = 'var(--texto-suave)';

    const { error } = await cliente.from('recursos').insert({ negocio_id: negocioActual, nombre });
    if (error) {
      mensaje.textContent = 'No se pudo agregar: ' + error.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    await cargarVistaRecursos();
  }

  async function renombrarRecurso(id, nuevoNombre) {
    const mensaje = document.getElementById('mensajeRecursos');
    const nombre = nuevoNombre.trim();

    if (!nombre) {
      mensaje.textContent = 'El nombre no puede quedar vacío.';
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    const { error } = await cliente.from('recursos').update({ nombre }).eq('id', id);
    if (error) {
      mensaje.textContent = 'No se pudo renombrar: ' + error.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    await cargarVistaRecursos();
  }

  async function eliminarRecurso(id, nombre) {
    const mensaje = document.getElementById('mensajeRecursos');
    mensaje.textContent = 'Verificando...';
    mensaje.style.color = 'var(--texto-suave)';

    // La tabla recursos tiene "on delete cascade" hacia citas: borrar un
    // recurso con citas asociadas las borraría también, sin poder
    // deshacerse. Se revisa antes de dejar continuar.
    const { count, error: errConteo } = await cliente
      .from('citas')
      .select('id', { count: 'exact', head: true })
      .eq('recurso_id', id);
    if (errConteo) {
      mensaje.textContent = 'No se pudo verificar: ' + errConteo.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    if (count > 0) {
      mensaje.textContent = `"${nombre}" tiene ${count} cita(s) asociada(s). No se puede eliminar sin perder ese historial — cancela o reasigna esas citas primero.`;
      mensaje.style.color = 'var(--rojo)';
      return;
    }

    if (!confirm(`¿Eliminar el recurso "${nombre}"? Esta acción no se puede deshacer.`)) {
      mensaje.textContent = '';
      return;
    }

    const { error } = await cliente.from('recursos').delete().eq('id', id);
    if (error) {
      mensaje.textContent = 'No se pudo eliminar: ' + error.message;
      mensaje.style.color = 'var(--rojo)';
      return;
    }
    await cargarVistaRecursos();
  }

  async function alternarDia(fechaStr, bloqueoId) {
    const mensaje = document.getElementById('mensajeCalendario');
    mensaje.textContent = 'Guardando...';
    mensaje.style.color = 'var(--texto-suave)';

    try {
      if (bloqueoId) {
        const { error } = await cliente.from('bloqueos').delete().eq('id', bloqueoId);
        if (error) throw error;
      } else {
        const [anio, mesNum, dia] = fechaStr.split('-').map(Number);
        const inicio = new Date(anio, mesNum - 1, dia);
        const fin = new Date(anio, mesNum - 1, dia + 1);
        const { error } = await cliente.from('bloqueos').insert({
          recurso_id: recursoSeleccionado,
          inicio: inicio.toISOString(),
          fin: fin.toISOString(),
          motivo: 'Cerrado manualmente desde el panel',
        });
        if (error) throw error;
      }
      await cargarVistaCalendario();
    } catch (err) {
      mensaje.textContent = 'No se pudo guardar: ' + err.message;
      mensaje.style.color = 'var(--rojo)';
    }
  }
</script>

</body>
</html>
